[project]
name = "rngd-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "furiosa-llm>=2026.4.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests==2.32.2",
    "tavily>=1.1.0",
]
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
